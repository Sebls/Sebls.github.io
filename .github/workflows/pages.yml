name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install prebuilt Trunk 0.22.1
        env:
          TRUNK_VERSION: 0.22.1
          TRUNK_SHA256: 2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/trunk"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$install_dir/trunk.tar.gz"
          printf '%s  %s\n' "$TRUNK_SHA256" "$install_dir/trunk.tar.gz" | sha256sum --check
          tar -xzf "$install_dir/trunk.tar.gz" -C "$install_dir" trunk
          "$install_dir/trunk" --version
          echo "$install_dir" >> "$GITHUB_PATH"
      - run: cargo fmt --check
      - run: cargo check --locked --target wasm32-unknown-unknown
      - run: cargo test --locked --lib
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Build static documents
        run: |
          ./scripts/build.sh /
          python3 scripts/verify-output.py dist /
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
