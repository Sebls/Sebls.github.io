name: Sync CV Submodule and Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 06:00 UTC to ensure any submodule updates are automatically pulled
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CV_SUBMODULE_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Update Submodules to Latest Remote Commit
        run: |
          git submodule update --remote --recursive

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run CV Sync Script
        run: |
          python3 scripts/sync_cv.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-sync
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
