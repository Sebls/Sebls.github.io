[package]
name = "sebls-portfolio"
version = "0.1.0"
edition = "2021"
default-run = "sebls-portfolio"
build = "build.rs"

[lib]
name = "portfolio"

[dependencies]
yew-router = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "HtmlCanvasElement", "Window", "Document", "Element", "HtmlElement", "DomRect", "MediaQueryList", "PointerEvent", "CssStyleDeclaration", "Location", "Event", "EventTarget"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
yew = { version = "0.23", features = ["hydration"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
yew = { version = "0.23", features = ["ssr"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
serde_json = "1"
pulldown-cmark = "0.13"
ammonia = "4"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
